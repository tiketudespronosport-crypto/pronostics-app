<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Les Pronos du Week-end</title>

  <!-- Aperçu de partage (WhatsApp, réseaux sociaux) -->
  <meta property="og:title" content="Les Pronos du Week-end" />
  <meta property="og:description" content="Des pronostics de football analysés sur les 5 grands championnats européens, chaque week-end." />
  <meta property="og:type" content="website" />
  <meta name="description" content="Des pronostics de football analysés sur les 5 grands championnats européens, chaque week-end." />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="theme-color" content="#0a2820" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== VUE : ACCUEIL (liste groupée par ligue) ===== -->
  <div id="view-home" class="view">
    <header class="hero">
      <p class="eyebrow"><span id="match-total"></span> matchs · Week-end</p>
      <h1>Les Pronos du Week-end</h1>
    </header>

    <div class="home-list" id="home-list"></div>
  </div>

  <!-- ===== VUE : DÉTAIL D'UN PRONOSTIC (accessible depuis Accueil) ===== -->
  <div id="view-detail" class="view" style="display:none;">
    <div class="detail-topbar">
      <button id="btn-back" class="back-btn">‹ Retour</button>
    </div>
    <div class="card-wrap">
      <div class="ticket" id="match-card"></div>
    </div>
  </div>

  <!-- ===== POPUP (pronostic premium verrouillé) ===== -->
  <div id="toast-backdrop" class="toast-backdrop"></div>
  <div id="toast" class="toast">
    <p id="toast-message" class="toast-message"></p>
    <input type="text" id="code-input" class="code-input" placeholder="Code d'accès (si déjà abonné)" />
    <p id="code-error" class="code-error"></p>
    <div class="toast-actions">
      <button id="toast-unlock" class="toast-btn primary">Débloquer</button>
    </div>
    <div class="toast-actions" style="margin-top:8px;">
      <button id="toast-close" class="toast-btn ghost">Fermer</button>
      <button id="toast-subscribe" class="toast-btn primary">💎 S'abonner</button>
    </div>
  </div>

  <!-- ===== VUE : HISTORIQUE ===== -->
  <div id="view-history" class="view" style="display:none;">
    <header class="hero">
      <p class="eyebrow">Résultats</p>
      <h1>Historique</h1>
      <p class="subtitle" id="history-summary"></p>
    </header>
    <div class="history-list" id="history-list"></div>
  </div>

  <!-- ===== VUE : PREMIUM ===== -->
  <div id="view-premium" class="view" style="display:none;">
    <header class="hero">
      <p class="eyebrow">Abonnement</p>
      <h1>Premium</h1>
      <p class="subtitle">Tous les pronostics, chaque week-end</p>
    </header>
    <div class="premium-banner">
      <p>💎 Abonnement bientôt disponible</p>
      <p class="premium-sub">En attendant, voici un aperçu de ce que tu débloques :</p>
    </div>
    <div class="match-list" id="premium-list"></div>
  </div>

  <!-- ===== NAVIGATION EN BAS ===== -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-view="home">
      <span class="nav-icon">🏠</span><span>Accueil</span>
    </button>
    <button class="nav-item" data-view="history">
      <span class="nav-icon">📊</span><span>Historique</span>
    </button>
    <button class="nav-item" data-view="premium">
      <span class="nav-icon">👑</span><span>Premium</span>
    </button>
  </nav>

  <script src="data.js"></script>
  <script src="results.js"></script>
  <script src="access.js"></script>
  <script src="teamcodes.js"></script>
  <script src="script.js"></script>
</body>
</html>
